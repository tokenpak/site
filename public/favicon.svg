<?xml version="1.0" encoding="UTF-8"?>
<!-- Split-color mark: "tp" in tp-ink on tp-paper, dot in tp-accent. An SVG favicon cannot read the page's CSS, so these hex values mirror the palette in tailwind.config.mjs and must be updated with it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TokenPak">
  <rect width="64" height="64" rx="12" fill="#F6F7F9"/>
  <text x="32" y="40"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20"
        font-weight="700">
    <tspan fill="#0B0F14">tp</tspan>
  </text>
  <circle cx="48" cy="16" r="6" fill="#00B4AA"/>
</svg>
