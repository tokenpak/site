name: sync-release-data

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [release-synced]
  schedule:
    # Safety net: resync daily at 07:15 UTC even if no dispatch fired.
    - cron: '15 7 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for dispatched release
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.client_payload.tag_name }}
        run: |
          max_attempts=24
          for attempt in $(seq 1 "$max_attempts"); do
            if gh api --silent "repos/tokenpak/tokenpak/releases/tags/$RELEASE_TAG"; then
              echo "Release $RELEASE_TAG is queryable."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Release $RELEASE_TAG is not queryable yet (attempt $attempt/$max_attempts)."
              sleep 5
            fi
          done

          echo "::error::Release $RELEASE_TAG did not become queryable within 120 seconds."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regenerate data/releases.json
        env:
          # MAIN_REPO_TOKEN has cross-repo read on tokenpak/tokenpak;
          # falls back to the workflow's default GITHUB_TOKEN (which works
          # now that tokenpak/tokenpak is public but keeps the explicit
          # higher-priority secret in place for future visibility flips).
          GITHUB_TOKEN: ${{ secrets.MAIN_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/sync-releases.ts
      - name: Validate + build (smoke)
        run: npm run build
      - name: Commit + push if changed
        id: commit
        run: |
          if ! git diff --quiet -- data/releases.json; then
            git config user.name  "TokenPak"
            git config user.email "hello@tokenpak.ai"
            git add data/releases.json
            git commit -m "site(data): refresh releases.json from GitHub Releases"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "releases.json unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploy if data changed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
